version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - forcetypeassert
    - gocritic
    - godot
    - govet
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - noctx
    - predeclared
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usetesting
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: var-naming
        - name: unused-parameter
        - name: context-as-argument
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - forcetypeassert
          - noctx
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/KhaosSystems/terraform-provider-paperclip

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
